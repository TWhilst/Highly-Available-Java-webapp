[build]
buildServer1 ansible_host=10.0.0.107 ansible_user=ec2-user ansible_ssh_private_key_file=/home/ec2-user/toche-key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
buildServer2 ansible_host=10.0.2.210 ansible_user=ec2-user ansible_ssh_private_key_file=/home/ec2-user/toche-key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
;
[deploy]
deployServer1 ansible_host= ansible_user=ubuntu ansible_ssh_private_key_file=/home/centos/toche1.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no' apache_package=apache2
deployServer2 ansible_host= ansible_user=ec2-user ansible_ssh_private_key_file=/home/centos/toche1.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no' apache_package=httpd

[local]
localhost ansible_connection=local