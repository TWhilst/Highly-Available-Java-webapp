---
- name: Create an AMI for the Deploy Server
  hosts: localhost
  tasks:
    - name: Gather information about any instance with a tag key Name and value Example
      amazon.aws.ec2_instance_info:
        filters:
          "tag:Name": deployServer2
      register: ec2_info
    - debug: { var: ec2_info }
    - name: Basic AMI Creation
      amazon.aws.ec2_ami:
        instance_id: "{{ec2_info.instances[0].instance_id}}"
        description: The AMI of the deploy server
        name: DeployJavaLinuxAmi
      register: ami_info
      ignore_errors: true
    - name: Check if AMI with base name exists
      amazon.aws.ec2_ami_info:
        filters:
          name: DeployJavaLinuxAmi
      register: existing_amis
    - debug: { var: existing_amis }
    - name: Get the security group info for the Public Subnet
      amazon.aws.ec2_group_info:
        filters:
          group-name: VPCLCL42837_FIRST_GRP
          vpc-id: "{{ ec2_info.instances[0].vpc_id}}"
      register: SG_info
    - name: Create an ec2 launch template
      amazon.aws.ec2_launch_template:
        name: "Deploy-scale-config"
        security_group_ids: "{{ SG_info.security_groups[0].group_id}}"
        image_id: "{{ existing_amis.images[0].image_id }}"
        key_name: toche-key
        instance_type: t2.micro
      register: temp_info
    - debug: { var: temp_info }
    - name: Get the info of the VPC for the instance
      amazon.aws.ec2_vpc_net_info:
        filters:
          "tag:Name": VPCLCL42837_FIRST
      register: vpc_info
    - debug: { var: vpc_info }
