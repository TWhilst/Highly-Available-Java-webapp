---
- name: Create a VPC with its requirements
  hosts: localhost
  gather_facts: yes
  tasks:
    - name: Create the AWS VPC
      amazon.aws.ec2_vpc_net:
        name: VPCLCL42837_FIRST
        cidr_block: 10.0.0.0/20
        region: us-west-2
      register: vpc_info
    - name: VPC Public Subnet in AZ1
      amazon.aws.ec2_vpc_subnet:
        cidr: 10.0.0.0/24
        region: us-west-2
        az: us-west-2a
        vpc_id: "{{ vpc_info.vpc.id }}"
        tags:
          Name: BUILD00001
    - name: VPC Private Subnet in AZ1
      amazon.aws.ec2_vpc_subnet:
        cidr: 10.0.1.0/24
        region: us-west-2
        az: us-west-2a
        vpc_id: "{{ vpc_info.vpc.id }}"
        tags:
          Name: DEPLOY00001
    - name: VPC Public Subnet in AZ2
      amazon.aws.ec2_vpc_subnet:
        cidr: 10.0.2.0/24
        region: us-west-2
        az: us-west-2b
        vpc_id: "{{ vpc_info.vpc.id }}"
        tags:
          Name: BUILD00011
    - name: VPC Private Subnet in AZ2
      amazon.aws.ec2_vpc_subnet:
        cidr: 10.0.3.0/24
        region: us-west-2
        az: us-west-2b
        vpc_id: "{{ vpc_info.vpc.id }}"
        tags:
          Name: DEPLOY00011






