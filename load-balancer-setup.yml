---
- name: Create a Load Balancer for the Deployment Servers
  hosts: localhost
  vars:
    ports:
      - 22
      - 80
      - 443
  tasks:
    - name: Get the info of the VPC for the instance
      amazon.aws.ec2_vpc_net_info:
        filters:
          "tag:Name": VPCLCL42837_FIRST
      register: vpc_info
    - name: Create a Security Group
      amazon.aws.ec2_group:
        name: VPCLCL42837_FIRST_WEBGRP
        description: SSH and HTTP and HTTPS access
        vpc_id: "{{ vpc_info.vpcs[0].id}}"
        rules:
          - proto: tcp
            ports: "{{ ports }}"
            cidr_ip: 0.0.0.0/0
      register: sg_info
    - name: Get the info of the VPC Subnet for the instance in AZ1
      amazon.aws.ec2_vpc_subnet_info:
        filters:
          "tag:Name": BUILD00001
          vpc-id: "{{ vpc_info.vpcs[0].id}}"
      register: subnet_info1
    - name: Get the info of the VPC Subnet for the instance in AZ2
      amazon.aws.ec2_vpc_subnet_info:
        filters:
          "tag:Name": BUILD00011
          vpc-id: "{{ vpc_info.vpcs[0].id}}"
      register: subnet_info11
    - name: Create a target group with a default health check
      community.aws.elb_target_group:
        name: VPCLCL42837-FIRST-ALB-TG
        protocol: http
        port: 80
        vpc_id: "{{ vpc_info.vpcs[0].id}}"
        state: present
      register: tg_info
    - debug: { var: tg_info }
    - name: Create The Load Balancer
      amazon.aws.elb_application_lb:
        name: VPCLCL42837-FIRST-ALB
        security_groups: "{{ sg_info.group_id}}"
        subnets:
          - "{{ subnet_info1.subnets[0].id}}"
          - "{{ subnet_info11.subnets[0].id}}"
        listeners:
          - Protocol: HTTP
            Port: 80
            DefaultActions:
              - Type: forward
                TargetGroupName: "{{ tg_info.target_group_name }}"
        state: present